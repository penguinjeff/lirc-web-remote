<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lirc Web Remote</title>
  <!-- Disable caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<script>
async function include(src, extension = "", multiple = []) {
  if (Array.isArray(multiple) && multiple.length > 0) {
    for (const item of multiple) {
      console.log(src + "/" + item + extension);
      await include(src + "/" + item, extension);
    }
    return;
  }
  if (
    multiple &&
    typeof multiple === "object" &&
    !Array.isArray(multiple) &&
    Object.keys(multiple).length > 0
  ) {
    for (const key of Object.keys(multiple)) {
      const value = multiple[key];

      // Array → list of files
      if (Array.isArray(value)) {
        await include(src + "/" + key, extension, value);
      }

      // Non-empty object → directory
      else if (value && typeof value === "object" && Object.keys(value).length > 0) {
        await include(src + "/" + key, extension, value);
      }

      // Empty object → file
      else {
        await include(src + "/" + key, extension, null);
      }
    }
    return;
  }
  return new Promise(resolve => {
    const s = document.createElement("script");
	s.type = "text/javascript";
    s.src = src + extension + "?ts=" + Date.now();
    s.onload = resolve;
    document.head.appendChild(s);
  });
}
</script>

<script>
async function loadAllScripts() {
  
  const tree = {
    defaults: [
      "get_default_display",
      "get_default_modules"
    ],
    js: {
      execute:{},
      refresh:{},
      options:{},
      build_remote: [
        "build_button",
        "build_module",
        "build_remote",
        "catchall_move",
        "build_catchall"
      ],
      build_edit: [
        "build_activities",
        "build_macros",
        "build_modules",
        "build_displays",
        "build_edit"
      ],
      build_selector: [
        "computeCollisions",
        "build_selector",
        "itemSelectorCollisionDetection",
        "itemSelectorSearch"
      ]
    }
  };
  await include(".",".js.txt",tree);
}

function refresh_db() {
 let list=["remotes","displays","activities","macros","modules"];
 refresh(list,run_after_refresh,{});
}

window.getremotests = 0;
window.getremotests_prev = 0;

function refresh_after_remotes() {
  refresh(["remotes"], new_remotes_check);
}

function new_remotes_check(list_ignore, db_ignore) {
  console.log("getremotests="+window.getremotests)
  console.log("getremotests_prev="+window.getremotests_prev)
  if (window.getremotests !== window.getremotests_prev) {
    window.getremotests_prev = window.getremotests;
    console.log("Remotes_loaded");
    refresh_db();
    return;
  }

  // Retry once after 1 second
  setTimeout(() => {
    refresh(["remotes"], () => {
      if (window.getremotests !== window.getremotests_prev) {
        refresh_db();
      } else {
        console.log("No change detected after retry");
      }
    });
  }, 1000);
}

let last_selected="";
function show_selected(sel) {
  // hide all
  groups.forEach(item=> window.divs[item+"_selector"].style.display = "none");
  groups.forEach(item=> window.divs[item+"_display"].style.display = "none");

  // show selected
  if (sel.value === "Refresh") {
    execute("list");
    refresh_after_remotes()
    window.divs["selector"].value = last_selected;   // restore previous selection
    show_selected(window.divs["selector"]);          // show that panel again
    return;
  }
  last_selected=sel.value;
  window.divs[sel.value + "_selector"].style.display = "";
  window.divs[sel.value + "_display"].style.display = "";
}

function run_after_refresh(list, db_in)
{
  db_in.all_modules = {
    ...db_in.modules,
    ...get_default_modules()
  };

  const db = JSON.parse(JSON.stringify(db_in));
  window.db = db;

  let select = "Activities";

  if (!options_from_keys(window.divs["Activities_selector"], db.activities)) select = "Remotes";
  if (!options_from_keys(window.divs["Remotes_selector"], db.remotes)) select = "Edit";
  if (last_selected !== "") select = last_selected;

  window.divs["selector"].value = select;
  groups.forEach(item => load(window.divs[item + "_selector"]));
  show_selected(window.divs["selector"]);
}

function load(__selector) {
  const type = __selector.id.replace("_selector", "");
  const display_dom = window.divs[type + "_display"];

  display_dom.replaceChildren();

  let activity;
  switch (type) {
    case "Edit":
      display_dom.appendChild(build_edit(db, __selector.value));
      return;
    case "Activities":
      activity = db[__selector.value] || { remotes: [], display: "" };
      break;
    case "Remotes":
      activity = { remotes: [__selector.value], display_name: "default_display" };
      break;
    default:
      console.warn("Unknown selector type:", type);
      return;
  }
  display_dom.appendChild(build_remote(db, activity));
}


/*find and globalize*/
function fg(id) {
  if(!window["divs"]){window["divs"]={};}
  const el = document.getElementById(id);
  if (!el) {
    console.warn(`fg: No element found with id="${id}"`);
    return null;
  }
  window.divs[id] = el;
  return el;
}

const groups=["Activities","Remotes","Edit"];
const editOptions = ["Activities","Macros","Modules","Displays"];
let activity_display=null;
window.addEventListener("load", async function () {
  await loadAllScripts();
  let bodyElement = document.body;
  let selectors = document.createElement("div");
  let displays = document.createElement("div");
  let selector = document.createElement("select");
  selector.id = "selector";
  selector.setAttribute("onchange", "show_selected(this)");
  selectors.appendChild(selector); 
  groups.forEach(item => {
    let selector = document.createElement("select");
    selector.id = item + "_selector";
    selector.style.display = "none";
    selector.setAttribute("onchange","load(this)")
    selectors.appendChild(selector);
    let display = document.createElement("div");
    display.id = item + "_display";
    display.style.display = "none";
    displays.appendChild(display);
  });
  bodyElement.appendChild(selectors);
  bodyElement.appendChild(displays); 
  ["selector", ...groups.flatMap(g => [g + "_selector", g + "_display"])]
   .forEach(id => fg(id));
  options_from_list(window.divs["selector"],[...groups,"Refresh"]);
  options_from_list(window.divs["Edit_selector"],editOptions)
  refresh_db()
});

</script>
<link rel="stylesheet" href="css/remote.css?ts=1">
</head>
<body></body>
</html>
